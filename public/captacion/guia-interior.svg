<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1188" viewBox="0 0 840 1188" role="img" aria-label="Pagina interior de la guia">
  <rect width="840" height="1188" fill="#faf9f6"/>
  <rect x="28" y="28" width="784" height="1132" fill="none" stroke="#e5e2dc" stroke-width="1.5"/>
  <text x="80" y="140" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" letter-spacing="-0.8">Las 7 decisiones</text>
  <text x="80" y="180" fill="#737373" font-family="Arial, Helvetica, sans-serif" font-size="18">Para tomarlas con m&#225;s claridad. No para que deje de apostar.</text>
  <text x="80" y="268" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">1. Ayudar o hacerte cargo</text>
  <text x="80" y="298" fill="#525252" font-family="Arial, Helvetica, sans-serif" font-size="18">C&#243;mo distinguir cu&#225;ndo tu ayuda sostiene el problema.</text>
  <text x="80" y="370" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">2. Prestar o no prestar</text>
  <text x="80" y="400" fill="#525252" font-family="Arial, Helvetica, sans-serif" font-size="18">Qu&#233; pensar antes de pasar plata o cubrir una deuda.</text>
  <text x="80" y="472" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">3. Qu&#233; l&#237;mite poner</text>
  <text x="80" y="502" fill="#525252" font-family="Arial, Helvetica, sans-serif" font-size="18">Uno que sirva sin convertirte en su polic&#237;a.</text>
  <text x="80" y="574" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">4. Creerle o no</text>
  <text x="80" y="604" fill="#525252" font-family="Arial, Helvetica, sans-serif" font-size="18">En qu&#233; fijarte cuando promete cambiar.</text>
  <text x="80" y="676" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">5. Volver a confiar</text>
  <text x="80" y="706" fill="#525252" font-family="Arial, Helvetica, sans-serif" font-size="18">Qu&#233; se&#241;ales permiten hacerlo de a poco.</text>
  <text x="80" y="778" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">6. Qu&#233; hacer si recae</text>
  <text x="80" y="808" fill="#525252" font-family="Arial, Helvetica, sans-serif" font-size="18">C&#243;mo responder sin volver al mismo ciclo.</text>
  <text x="80" y="880" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">7. Si no quiere ayuda</text>
  <text x="80" y="910" fill="#525252" font-family="Arial, Helvetica, sans-serif" font-size="18">Lo que s&#237; puedes hacer t&#250;.</text>
  <text x="80" y="1100" fill="#737373" font-family="Arial, Helvetica, sans-serif" font-size="16">Gonzalo Pedrosa, psic&#243;logo cl&#237;nico</text>
</svg>
